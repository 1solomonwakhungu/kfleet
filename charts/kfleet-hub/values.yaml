replicaCount: 1

image:
  repository: ghcr.io/1solomonwakhungu/kfleet/hub
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080
  nodePort: ""
  annotations: {}

persistence:
  enabled: true
  # WARNING: setting enabled=false mounts an emptyDir instead of a PVC. The
  # hub stores its single SQLite database (clusters, agents, users, sessions,
  # audit log) under mountPath, so every pod restart loses ALL data and there
  # is nothing to recover. Disable persistence only for throwaway demo or
  # ephemeral CI environments.
  size: 1Gi
  mountPath: /data
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: kfleet.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    enabled: false
    secretName: ""
    hosts: []

registration:
  # Required unless registration.existingSecret points at a Secret that holds
  # the agent registration token. The chart fails at install time when both
  # are empty: an empty KFLEET_REGISTRATION_TOKEN would ship agent
  # registration open.
  token: ""
  # Name of an existing Secret holding the registration token instead of the
  # chart-managed Secret. existingSecretKey defaults to "registration-token".
  existingSecret: ""
  existingSecretKey: "registration-token"

alerts:
  webhook:
    # Leave empty to retain alert history without sending notifications. When
    # set, the URL is rendered into the chart Secret (alert-webhook-url key)
    # and injected into the hub through valueFrom.
    url: ""
    # HMAC signing secret for webhook payloads. Always rendered into the
    # chart-managed Secret (alert-webhook-secret key).
    secret: ""
  maxAttempts: 5
  retryBase: 5s
  pollInterval: 1s

timeline:
  # Operational events older than this duration are pruned by the hub.
  retention: 2160h

auth:
  sessionDuration: 24h
  # Keep false when the hub is served over HTTPS. Set true only for a local
  # plain-HTTP environment such as the kind quickstart.
  sessionCookieInsecure: false
  bootstrapAdmin:
    # These values create the first admin only when the database has no users.
    # Supply all three together. Prefer a protected values file or secret
    # management integration instead of command-line values in production.
    username: ""
    email: ""
    password: ""
    # Name of an existing Secret holding the bootstrap admin credentials
    # instead of the chart-managed Secret. The *Key values default to the
    # chart-managed key names above and must match keys in existingSecret.
    existingSecret: ""
    existingSecretUsernameKey: "bootstrap-admin-username"
    existingSecretEmailKey: "bootstrap-admin-email"
    existingSecretPasswordKey: "bootstrap-admin-password"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

# The hub currently does not call the Kubernetes API. This switch is reserved
# for installations that add API-backed hub integrations.
rbac:
  create: false

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
