image:
  repository: ghcr.io/1solomonwakhungu/kfleet/agent
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

hub:
  url: ""
  # Registration token presented to the hub. Required unless hub.existingSecret
  # names a Secret that already holds the token.
  token: ""
  # PEM-encoded CA bundle used to verify the hub's TLS certificate. Set this
  # when the hub serves a certificate signed by a private CA or is
  # self-signed. Leave empty to use the operating system trust store.
  caBundle: ""
  # Name of an existing Secret that holds the hub registration token. When
  # set, the chart does not render its own token Secret and hub.token is
  # ignored. Useful with External Secrets Operator / Sealed Secrets so the
  # token never appears in values.
  existingSecret: ""
  # Key within hub.existingSecret that holds the registration token.
  existingSecretKey: "hub-token"

tenant:
  id: default

cluster:
  name: ""
  labels: {}

reportInterval: 30s

health:
  # Port the agent serves its probe endpoints on.
  # /healthz is plain liveness and always answers 200.
  # /readyz answers 200 only once the agent has registered with the hub and
  # a registration, heartbeat, or status report succeeded within 3x the
  # agent heartbeat interval (45s). During a hub outage the pod reports
  # NotReady until contact resumes; kubelet does not restart it. Keep the
  # readiness probe's initialDelaySeconds small (5s) so the first contact
  # gates readiness quickly while the probe's failureThreshold absorbs the
  # startup registration delay.
  port: 8081

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

rbac:
  create: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
