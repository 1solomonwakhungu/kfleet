name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      uses_pat: ${{ steps.token.outputs.uses_pat }}
    steps:
      # A tag pushed with GITHUB_TOKEN does not start other workflows, so the
      # publish job below runs the release pipeline directly. When the
      # RELEASE_PLEASE_TOKEN secret (a fine-grained PAT) is configured, the tag
      # push triggers release.yml on its own and the publish job stands down to
      # avoid publishing twice. The PAT also lets CI run on release PRs.
      - name: Detect release token
        id: token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -n "$RELEASE_PLEASE_TOKEN" ]; then
            echo "uses_pat=true" >> "$GITHUB_OUTPUT"
          else
            echo "uses_pat=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.uses_pat != 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
