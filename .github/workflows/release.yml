name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to publish (for example, v1.2.3)
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: Release tag to publish (for example, v1.2.3)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component:
          - hub
          - agent
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.ref }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ inputs.version || github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.component }}:${{ inputs.version || github.ref_name }}
            ghcr.io/${{ github.repository }}/${{ matrix.component }}:latest
          cache-from: type=gha,scope=release-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.component }}

  charts:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.ref }}
      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Package Helm charts
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ "$RELEASE_TAG" != v* || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tag must be a semantic version prefixed with v (for example, v1.2.3)" >&2
            exit 1
          fi

          mkdir -p dist/charts
          for chart in charts/kfleet-hub charts/kfleet-agent; do
            helm lint "$chart" \
              --set hub.url=https://kfleet.example.com \
              --set hub.token=release-validation-token \
              --set cluster.name=release-validation
            helm package "$chart" \
              --version "$version" \
              --app-version "$RELEASE_TAG" \
              --destination dist/charts
          done
      - name: Push Helm charts
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for chart in dist/charts/*.tgz; do
            helm push "$chart" "oci://ghcr.io/$owner/charts"
          done

  release:
    needs: charts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.version || github.ref }}
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.11"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and embed web UI
        run: make web-build
      # The web build empties both dist directories, deleting their tracked
      # .gitkeep placeholders. Restore them so GoReleaser sees a clean tree;
      # this also covers tags whose Makefile predates the same fix.
      - name: Restore tracked web placeholders
        run: git checkout -- web/dist/.gitkeep internal/hub/web/dist/.gitkeep
      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Package release charts
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p .release
          helm package charts/kfleet-hub charts/kfleet-agent \
            --version "$version" \
            --app-version "$RELEASE_TAG" \
            --destination .release
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2
          args: release --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
